<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <meta name="description" content="Play Rock, Paper, Scissors against the computer. First to five points wins.">
    <title>Rock, Paper, Scissors</title>
</head>
<body>
    <header>

    </header>
    <main>
        <div class="title">
            <h1>Rock, paper, <span>scissors.</span></h1>
        </div>
    <div class="container">
        <p class="eyebrow">A quick game of chance</p>
        <h2>Choose your move</h2>
        <p class="score-label">First to 5 points wins</p>
        <div id="score" class="score" aria-live="polite">You 0 — 0 Computer</div>
        <div class="choices">
            <button id="Rock" type="button">Rock</button>
            <button id="Paper" type="button">Paper</button>
            <button id="Scissors" type="button">Scissors</button>
        </div>
        <div id="result" role="status" aria-live="polite">Make your move to play.</div>
    </div>
    </main>

    <footer>

    </footer>
    <script src="../Script.js"></script>
</body>
</html>
